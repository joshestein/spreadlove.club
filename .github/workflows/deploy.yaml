name: Deploy Go Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # Pinned: cgo (go-sqlite3) links against the runner's glibc, which must
    # not be newer than the server's (Debian 12, glibc 2.36).
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Build Go application
        run: |
          go build -trimpath -o bin/spreadlove ./cmd/web
          go build -trimpath -o bin/spreadlove_mailer ./cmd/mailer
          mkdir -p dist
          cp -r bin dist/
          cp -r web dist/
          echo "${{ secrets.ENV_FILE }}" | base64 --decode > dist/.env
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spreadlove-dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spreadlove-dist
          path: dist

      # Artifacts drop file modes.
      - name: Restore permissions
        run: chmod 755 dist/bin/spreadlove dist/bin/spreadlove_mailer

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_KNOWN_HOSTS: ${{ secrets.REMOTE_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$REMOTE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Deploy to VPS using rsync
        run: rsync -rlptvz dist/ vps:spreadlove/

      # Needs NOPASSWD for this command in /etc/sudoers.d/spreadlove.
      - name: Restart Go service on VPS
        run: ssh vps 'sudo systemctl restart spreadlove.service'
