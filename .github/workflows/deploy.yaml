name: Deploy Go Backend

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    # Pinned: cgo (go-sqlite3) links against the runner's glibc, which must
    # not be newer than the server's (Debian 12, glibc 2.36).
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.1"

      - name: Build Go application
        run: |
          go build -trimpath -o bin/spreadlove ./cmd/web
          go build -trimpath -o bin/spreadlove_mailer ./cmd/mailer
          mkdir -p dist
          cp -r bin dist/
          cp -r web dist/
          echo "${{ secrets.ENV_FILE }}" | base64 --decode > dist/.env
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spreadlove-dist
          path: dist/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: spreadlove-dist
          path: dist

      # Artifacts drop file modes.
      - name: Restore permissions
        run: chmod 755 dist/bin/spreadlove dist/bin/spreadlove_mailer

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_KNOWN_HOSTS: ${{ secrets.REMOTE_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$REMOTE_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Deploy to VPS using rsync
        run: rsync -rlptvz dist/ vps:spreadlove/

      # Needs NOPASSWD for this command in /etc/sudoers.d/spreadlove.
      - name: Restart Go service on VPS
        run: ssh vps 'sudo systemctl restart spreadlove.service'
