<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spread Love - Submit</title>
    <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/css/style.css" />
  </head>
  <body>
    <form class="submit-form container center" action="/api/message" method="post">
      <textarea
        name="content"
        required
        placeholder="What do you want others to know?"
      ></textarea>

      <button type="submit" class="btn">Spread Love</button>
      <p id="status" role="status" hidden></p>
    </form>
    <nav>
      <a href="/">Back</a>
    </nav>
  </body>
</html>
